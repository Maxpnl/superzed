[package]
name = "superzed_sidebar"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/superzed_sidebar.rs"

[dependencies]
chrono.workspace = true
db.workspace = true
editor.workspace = true
git_ui.workspace = true
gpui.workspace = true
menu.workspace = true
project.workspace = true
project_panel.workspace = true
superzed_accounts.workspace = true
superzed_actions.workspace = true
superzed_canvas.workspace = true
superzed_notifications.workspace = true
superzed_sessions.workspace = true
superzed_sources.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true

[dev-dependencies]
db = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
# superzed: senza questa, `remote/test-support` (acceso da project/workspace test-support)
# rende visibile RemoteConnectionOptions::Mock anche nel codice non-test di remote_connection
# (dipendenza normale di git_ui), che pero' non lo gestisce senza la propria feature: match
# non esaustivo. Vedi git_ui/Cargo.toml: test-support = [.., "remote_connection/test-support"].
remote_connection = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
settings = { workspace = true, features = ["test-support"] }
superzed_accounts = { workspace = true, features = ["test-support"] }
superzed_done = { workspace = true, features = ["test-support"] }
superzed_ipc.workspace = true
superzed_sources = { workspace = true, features = ["test-support"] }
task.workspace = true
tempfile.workspace = true
terminal_view.workspace = true
theme.workspace = true
theme_settings.workspace = true
workspace = { workspace = true, features = ["test-support"] }
